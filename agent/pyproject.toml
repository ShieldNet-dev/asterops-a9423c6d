[project]
name = "asterops-agent"
version = "0.1.0"
description = "AsterOps — VoIP security hardening, auto-configuration, and posture reporting (Asterisk first; pluggable for other VoIP systems)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "AsterOps contributors" }]
keywords = ["asterisk", "voip", "sip", "tls", "srtp", "security", "hardening", "pjsip"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Telephony",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "requests>=2.31",
  "rich>=13.7",
  "cryptography>=42.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=61.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
asterops = "asterops_agent.cli:main"
asterops-agent = "asterops_agent.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asterops_agent*"]

[tool.setuptools.package-data]
"asterops_agent" = ["templates/*.j2", "profiles/*.yaml"]
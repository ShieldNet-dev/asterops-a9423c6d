<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AsterOps — Hardened Control Plane for Asterisk</title>
    <meta
      name="description"
      content="Open-source control plane for Asterisk PBX fleets. Secure provisioning, enforced encryption, and immutable audit logs."
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("asterops-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved || (prefersDark ? "dark" : "light");
          if (theme === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
